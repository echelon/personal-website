[workspace]
members = ["crates/sitegen"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
lol_html = "2"
percent-encoding = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug = "0.1"
tempfile = "3"
toml = "0.9"
url = "2"
walkdir = "2"
